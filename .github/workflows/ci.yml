name: core-conformance
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  installed-artifact:
    name: conformance (${{ matrix.python }}, ${{ matrix.artifact }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
        artifact: [wheel, sdist]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build the candidate
        run: |
          python -m pip install -r requirements-build.txt
          python -m build --no-isolation
      - name: Install and exercise the exact artifact outside source
        env:
          HANDOFF_ARTIFACT_KIND: ${{ matrix.artifact }}
        run: |
          HANDOFF_TEST_ENV="$RUNNER_TEMP/handoff-test"
          python -m venv "$HANDOFF_TEST_ENV"
          if [ "$HANDOFF_ARTIFACT_KIND" = wheel ]; then
            HANDOFF_ARTIFACTS=(dist/*.whl)
          else
            HANDOFF_ARTIFACTS=(dist/*.tar.gz)
          fi
          test "${#HANDOFF_ARTIFACTS[@]}" -eq 1
          "$HANDOFF_TEST_ENV/bin/python" -m pip install --no-deps "${HANDOFF_ARTIFACTS[0]}"
          cd "$RUNNER_TEMP"
          "$HANDOFF_TEST_ENV/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.15.20
      - run: ruff check src tests
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum pinned)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --verbose .

  required-checks-fail-closed:
    if: ${{ always() }}
    needs: [installed-artifact, lint, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Require every prerequisite to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json,os; results=json.loads(os.environ["RESULTS"]); assert results and all(v["result"]=="success" for v in results.values()), results'
